name: Actualizar DXpeditions
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Actualizar calendario NG3K
        run: python scripts/update_dx.py
      - name: Guardar resultados si cambiaron
        run: |
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add dxpeditions.json
          git diff --cached --quiet || (git commit -m 'Actualizar expediciones DX' && git push)
